function render(){
  $('#raised').textContent=sum(x=>x.status==='confirmed').toFixed(2);$('#people').textContent=data.supporters.length;$('#count').textContent=data.projects.length;
  $('#cards').innerHTML=data.projects.map(p=>{const got=sum(s=>s.project===p.id&&s.status==='confirmed');
    return `<article class="card"><div style="height:100px;display:grid;place-items:center;color:#e8bd72;font-size:42px">${p.image?`<img src="${esc(p.image)}" style="max-width:100%;max-height:100px">`:'✦'}</div><h3>${esc(pt(p))}</h3><p>${esc(pd(p))}</p><div class="progress"><i style="width:${Math.min(100,got/Number(p.goal)*100||0)}%"></i></div><small>${got.toFixed(2)} / ${p.goal} USDT</small><p><button class="gold" onclick="support(${p.id})">${t('spj')}</button></p></article>`}).join('');
  if(logged)renderAdmin();
}
function renderAdmin(){
  $('#summary').textContent=`${t('sl')}: ${sum(x=>x.status==='confirmed').toFixed(2)} USDT — ${t('req')}: ${data.supporters.length} — ${t('pen')}: ${data.supporters.filter(x=>x.status==='pending').length}`;
  $('#projectRows').innerHTML=data.projects.map(p=>`<div class="row"><span>${esc(pt(p))} — ${t('gt')} ${p.goal} USDT</span><button onclick="removeProject(${p.id})">${t('del')}</button></div>`).join('');
  $('#supportRows').innerHTML=data.supporters.map((s,i)=>`<div class="row"><span>${esc(s.name||t('anon'))}<small>${esc(s.email||t('noac'))} · ${esc(s.date)} · ${esc(s.network)} · TXID: ${esc(s.txid)} · ${s.status==='confirmed'?t('cfm'):t('pen')}</small></span><span><b>${Number(s.amount).toFixed(2)} USDT</b>${s.status==='pending'?` <button onclick="confirmSupport(${i})">${t('vf')}</button>`:''}</span></div>`).join('')||t('nos');
  $('#messageRows').innerHTML=data.messages.map(m=>`<div class="row"><span>${esc(m.name)} (${esc(m.email)})<small>${esc(m.message)}</small></span></div>`).join('')||t('nom');
}
window.support=id=>{const p=data.projects.find(p=>p.id===id);$('#supportName').textContent=p?pt(p):t('spj');$('#supportForm').project.value=id;$('#walletDisplay').textContent=data.wallet||t('wd');show('supportModal')};

$('#lang').onchange=e=>{L=e.target.value;LS.set('mp_lang',L);close();applyLang()};
$('#login').onclick=()=>show('loginModal');$('#admin').onclick=()=>logged?show('adminModal'):show('adminLoginModal');
document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-auth]').forEach(x=>x.classList.toggle('active',x===b));$('#userLoginForm').classList.toggle('hidden',b.dataset.auth!=='signin');$('#signupForm').classList.toggle('hidden',b.dataset.auth!=='signup')});
$('#userLoginForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),u=data.users.find(x=>x.email===String(f.get('email')).toLowerCase()&&x.password===f.get('password'));if(!u)return alert(t('bad'));currentUser=u;close();alert(t('hi')+' '+u.name)};
$('#signupForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).toLowerCase();if(data.users.some(x=>x.email===email))return alert(t('dup'));data.users.push({name:f.get('name'),email,password:f.get('password')});save();e.target.reset();alert(t('ok'))};
$('#adminLoginForm').onsubmit=e=>{e.preventDefault();if(e.target.password.value===adminPassword){logged=true;e.target.reset();close();renderAdmin();show('adminModal')}else alert(t('badA'))};
$('#logout').onclick=()=>{logged=false;close()};
$('#walletForm').onsubmit=e=>{e.preventDefault();const w=String(new FormData(e.target).get('wallet')).trim();if(w&&!/^T[1-9A-HJ-NP-Za-km-z]{25,40}$/.test(w))return alert(t('badW'));data.wallet=w;save();$('#walletStatus').textContent=t('ok')};
$('#changeAdminPasswordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),np=String(f.get('newpass'));if(String(f.get('current'))!==adminPassword)return alert(t('badC'));if(np!==String(f.get('confirm')))return alert(t('badM'));adminPassword=np;LS.set('myprojects_admin_password',np);e.target.reset();alert(t('ok'))};
$('#supportForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.supporters.push({project:Number(f.get('project')),name:f.get('name')||currentUser?.name||'',email:currentUser?.email||'',amount:Number(f.get('amount')),txid:f.get('txid'),network:'USDT TRC20',status:'pending',date:new Date().toLocaleString()});save();e.target.reset();close();render();alert(t('loc'))};
$('#projectForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.projects.push({id:Date.now(),title:f.get('title'),goal:Number(f.get('goal')),image:f.get('image'),description:f.get('description')});save();e.target.reset();render();alert(t('ok'))};
$('#contactForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.messages.push({name:f.get('name'),email:f.get('email'),message:f.get('message'),date:new Date().toLocaleString()});save();e.target.reset();$('#contactStatus').textContent=t('ok')};
window.confirmSupport=i=>{if(confirm(t('q1'))){data.supporters[i].status='confirmed';save();render()}};
window.removeProject=id=>{if(confirm(t('q2'))){data.projects=data.projects.filter(p=>p.id!==id);save();render()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['overview','projectsAdmin','supporters','messages','settings'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});
applyLang();
</script></body></html>
